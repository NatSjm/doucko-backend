spring:
  application:
    name: doucko-backend
  datasource:
    # Values come from the environment (.env, never committed — see .env.example).
    url: ${DOUCKO_DB_URL:jdbc:postgresql://localhost:5432/doucko}
    username: ${DOUCKO_DB_USER:doucko}
    password: ${DOUCKO_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema (append-only migrations); Hibernate only validates it.
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      # RFC 7807 problem responses instead of raw error pages.
      enabled: true
    # NFR-3: never log request parameters or header values (DispatcherServlet masks them while false).
    log-request-details: false
  servlet:
    multipart:
      # NFR-17: a source PDF is at most 50 MB (an image 5 MB, checked by the use case). A larger file is refused
      # while the request is parsed: 413 problem+json (UploadLimitAdvice).
      max-file-size: 50MB
      max-request-size: 51MB
  messages:
    # NFR-9: backend copy (problem titles, details) comes from messages*.properties.
    basename: messages
    fallback-to-system-locale: false

server:
  tomcat:
    # NFR-17: read (and drop) the rest of an oversized upload, so the client receives the 413 instead of a reset.
    max-swallow-size: -1
  servlet:
    session:
      # admin-access (NFR-15): the admin session. AdminIdleTimeoutFilter enforces the 8 h idle expiry on
      # the backend clock; Tomcat's own timeout is the same 8 h, as a backstop. Only cookies, never URLs.
      timeout: 8h
      tracking-modes: cookie
      cookie:
        name: SESSION
        http-only: true
        same-site: strict
        # Only the admin API receives it: child endpoints never see the admin session (NFR-1).
        path: /api/admin
  error:
    include-stacktrace: never
    include-exception: false

logging:
  level:
    # NFR-3: at DEBUG, Spring Security logs "Securing <METHOD> <path>?<query>" and Spring MVC logs a
    # bound request body ("Read ... to ..."). logback-spring.xml caps these loggers at INFO whatever is
    # set here (RequestContentLogGuard); the levels below say the same. RequestContentNotLoggedTest guards it.
    org.springframework.web: INFO
    org.springframework.security: INFO

management:
  endpoints:
    web:
      exposure:
        # NFR-2: only the compose healthcheck needs actuator; nothing else is reachable from the LAN.
        include: health
      # The /actuator root would list the exposed endpoints as HAL JSON; off, it is an undeclared
      # path like any other (404 problem+json).
      discovery:
        enabled: false

doucko:
  profile:
    # child-profile: the task locales a profile may pick as secondaryTaskLocale (FR-43). Configuration,
    # not code: an empty list refuses every locale. MVP: Ukrainian only.
    task-locales: uk
  content:
    # content-authoring (CA-D16): allowed grades and subjects. MVP: grade 6, math.
    grades: 6
    subjects: math
    # FR-8: the same configured task locales as the profile (one setting).
    task-locales: ${doucko.profile.task-locales}
    # NFR-17: uploaded PDFs and images, outside every repository working tree (refused otherwise).
    # Compose mounts the doucko-storage volume here.
    storage-dir: ${DOUCKO_STORAGE_DIR:${user.home}/.doucko/storage}
