checking.tip.FRACTION=Tenhle zlomek neumím přečíst. Zkus zlomek, smíšené nebo desetinné číslo, třeba {0}.
checking.tip.NUMBER_WITH_UNIT=Tohle neumím přečíst. Napiš číslo a jednotku bez mezer v ní, třeba {0}.
checking.tip.TEXT=Odpověď neumím přečíst. Napiš ji slovy, nejvýš 100 znaků.
checking.tip.CHOICE_SINGLE=Vyber jednu z nabídnutých možností.
checking.tip.CHOICE_MULTI=Vyber jednu nebo víc z nabídnutých možností.
