# Backend message catalog (NFR-9). Problem titles and details are resolved here through the
# MessageSource ("problemDetail.title.<exception>" / "problemDetail.<exception>"), never hard-coded.
# API-level copy is English; the child UI shows Czech copy from the frontend catalog.
problemDetail.title.org.springframework.web.servlet.resource.NoResourceFoundException=Resource not found
problemDetail.org.springframework.web.servlet.resource.NoResourceFoundException=No API resource exists at this path.
problemDetail.title.org.springframework.web.HttpRequestMethodNotSupportedException=Method not allowed
problemDetail.org.springframework.web.HttpRequestMethodNotSupportedException=This path does not support the {0} method.
# Problems written outside MVC exception handling (security refusals, firewall rejections, /error):
# problem.title.<status> / problem.detail.<status>, falling back to problem.title / problem.detail.
problem.title=Request failed
problem.detail=The request could not be completed.
problem.title.400=Bad request
problem.detail.400=The request URL is not allowed.
problem.title.403=Access denied
problem.title.404=Resource not found
problem.detail.404=No API resource exists at this path.
problem.title.401=Unauthorized
problem.detail.401=Sign in to the admin area first.
problem.detail.403=The request was refused. Reload the page and try again.
